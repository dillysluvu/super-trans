[package]
name = "super-trans-native"
version = "0.1.0"
edition = "2021"
description = "Bộ chia văn bản dài siêu nhanh cho SuperTrans"
license = "MIT"
publish = false

[[bin]]
name = "super-trans-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
