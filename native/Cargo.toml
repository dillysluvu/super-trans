[package]
name = "super-trans-native"
version = "0.2.0"
edition = "2021"
description = "Helper Rust cho SuperTrans: chia văn bản dài và IPC Dynamic Island"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"

[[bin]]
name = "super-trans-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
